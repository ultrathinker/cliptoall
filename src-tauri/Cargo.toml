[package]
name = "cliptoall-tauri2"
version = "5.1.25"
description = "ClipToAll - Screenshot capture, annotation and upload tool"
authors = ["ultrathinker"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

# The plugin system is Windows-only — gated with `#[cfg(windows)]`, not with a
# Cargo feature, so there is exactly one macOS build and what you run is what
# ships. Three reasons it cannot live on macOS:
#   * `plugins_dir()` resolves to <exe dir>/plugins, which inside a .app bundle
#     is `Contents/MacOS/plugins`. Dropping an executable there breaks the code
#     signature of a notarised app — so the mechanism is broken on macOS even
#     outside the App Store.
#   * The App Sandbox forbids spawning external interpreters outright, so the
#     store edition could never have it regardless of how it were gated.
#   * A build flag would mean two macOS binaries to test by hand, and the one
#     you happened to launch would not necessarily be the one that ships.
# The code is not deleted — restoring it is a change of cfg predicate.
# `geometry::OverlayResult::PluginCall` stays on both platforms: it carries two
# `String`s and lets `handle_overlay_result` keep one identical shape.

[dependencies]
# The macOS web overlay window does NOT need transparency. It draws the dimmed
# screenshot onto a canvas covering the whole screen (`100vw` × `100vh`,
# `position: fixed`, `inset: 0` in OverlayWeb.svelte), so its visible content is
# already opaque edge to edge. The `transparent: true` call that previously
# required Tauri's `macos-private-api` feature is removed — see Phase 1 of
# docs/macos-port/APP-STORE-PLAN.md for why that feature gates the App Store
# build and why the flag is unneeded here. (Verified: brief §1, phase 14 task.)
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-single-instance = "2.0"
tauri-plugin-opener = "2.0"
# Save-As native panel on macOS (Phase 3 / TASK 3). Without this the editor's
# "Save as file" button called `save_image_to_file`, which is a stub on macOS
# that returned "save_image_to_file not yet implemented on macOS" — the
# raw string landed in the error modal. The dialog plugin gives us a proper
# `NSSavePanel`; the Rust side then encodes/copies to the chosen path via
# the new `save_image_to_path` command (see commands/capture.rs).
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
aws-config = "1.5"
aws-sdk-s3 = "1.50"
reqwest = { version = "0.12", features = ["json", "multipart"] }
sha2 = "0.10"
base64 = "0.22"
image = "0.25"
little_exif = "0.6"
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
dirs = "5.0"
urlencoding = "2.1"
# Non-poisoning sync locks: a panic while holding the guard won't poison the
# lock, so one bug can't cascade into every later .lock() panicking (finding #7).
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_Controls_Dialogs", "Win32_System_JobObjects"] }
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
# ScreenCaptureKit — replaces `xcap` for capture (Phase 2.3 / SCK migration).
# `SCScreenshotManager.captureImage` is macOS 14+, which is the floor this
# project committed to on 2026-08-16 (EXECUTION-PLAN.md §2). Default features
# already pull in SCShareableContent + SCScreenshotManager + CG/CF bindings.
objc2-screen-capture-kit = { version = "0.3", default-features = true, features = ["SCScreenshotManager", "SCShareableContent"] }
# Already pulled in transitively by the crates above, but bug #7 in HANDOFF
# and §3.1 of the SCK migration brief say: "being in Cargo.lock transitively
# is NOT the same as being usable" — anything we name in code must be declared
# explicitly under the same target gate.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSError", "NSString", "NSURL"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGColorSpace", "CGContext", "CGDataProvider", "CGDirectDisplay", "CGWindow"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
block2 = "0.6"

[target."cfg(not(windows))".dependencies]
arboard = "3.6.1"
# Clipboard images on macOS/Linux use `arboard::set_image`. `xcap` was used
# historically here for screen capture; SCK migration removed the only
# consumer. If anything regresses (see HANDOFF §6 for the catalogue), the
# former `xcap = "0.9.8"` line was gated under this same target.
