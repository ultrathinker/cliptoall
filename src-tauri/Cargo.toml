[package]
name = "cliptoall-tauri2"
version = "5.1.25"
description = "ClipToAll - Screenshot capture, annotation and upload tool"
authors = ["ultrathinker"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

# Plugin system (plugins.rs, commands/plugins.rs and every call site), gated by
# one cfg alias, `cfg(plugins)`, which build.rs sets:
#   * Windows: always on. Plugins live in <exe dir>/plugins.
#   * macOS: only with `--features personal` (the owner's personal build, see
#     docs/macos-port/PERSONAL-BUILD.md). The default macOS build, which is what
#     is published and what the App Store edition is made from, has no plugin
#     code compiled in at all; CI checks that with a marker string
#     (scripts/check-plugin-gate.sh).
# Why the macOS default is off: a plugin is an arbitrary executable that runs
# with the app's privileges and receives the clipboard, which is not something
# a public screenshot tool should ship; and under the App Sandbox a plugin
# could neither be installed outside the app's container nor run unsandboxed
# (children inherit the sandbox), and App Review rejects downloading or running
# external code (guideline 2.5.2), so the store edition could never have it
# anyway. The personal build is signed Developer ID and NOT sandboxed.
# Why its plugins dir is ~/Library/Application Support/<app>/plugins and not
# next to the executable: inside a .app that would be Contents/MacOS/plugins,
# and adding a file there breaks the notarised bundle's code signature.
# `geometry::OverlayResult::PluginCall` stays in every build: it carries two
# `String`s and lets `handle_overlay_result` keep one shape.
[features]
default = []
# Personal build: plugin system on macOS, plus a separate app name, data dir
# and Keychain service (src/utils/app_identity.rs) so it installs side by side
# with the public app. Built with the tauri.personal.conf.json overlay, which
# gives it its own bundle identifier. Never published.
personal = []

[dependencies]
# The macOS web overlay window does NOT need transparency. It draws the dimmed
# screenshot onto a canvas covering the whole screen (`100vw` × `100vh`,
# `position: fixed`, `inset: 0` in OverlayWeb.svelte), so its visible content is
# already opaque edge to edge. The `transparent: true` call that previously
# required Tauri's `macos-private-api` feature is removed: that private-API
# flag would keep the build out of the Mac App Store, and the window does not
# need it.
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-clipboard-manager = "2.0"
tauri-plugin-single-instance = "2.0"
tauri-plugin-opener = "2.0"
# Save-As native panel on macOS (Phase 3 / TASK 3). Without this the editor's
# "Save as file" button called `save_image_to_file`, which is a stub on macOS
# that returned "save_image_to_file not yet implemented on macOS" — the
# raw string landed in the error modal. The dialog plugin gives us a proper
# `NSSavePanel`; the Rust side then encodes/copies to the chosen path via
# the new `save_image_to_path` command (see commands/capture.rs).
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
aws-config = "1.5"
aws-sdk-s3 = "1.50"
reqwest = { version = "0.12", features = ["json", "multipart"] }
sha2 = "0.10"
base64 = "0.22"
image = "0.25"
little_exif = "0.6"
uuid = { version = "1.10", features = ["v4"] }
chrono = "0.4"
dirs = "5.0"
urlencoding = "2.1"
# Non-poisoning sync locks: a panic while holding the guard won't poison the
# lock, so one bug can't cascade into every later .lock() panicking (finding #7).
parking_lot = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_Controls_Dialogs", "Win32_System_JobObjects"] }
winreg = "0.52"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
# ScreenCaptureKit — replaces `xcap` for capture (Phase 2.3 / SCK migration).
# `SCScreenshotManager.captureImage` is macOS 14+, which is the floor this
# project committed to on 2026-08-16. Default features
# already pull in SCShareableContent + SCScreenshotManager + CG/CF bindings.
objc2-screen-capture-kit = { version = "0.3", default-features = true, features = ["SCScreenshotManager", "SCShareableContent"] }
# Already pulled in transitively by the crates above, but being in Cargo.lock
# transitively is NOT the same as being usable: anything we name in code must
# be declared explicitly under the same target gate.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSError", "NSString", "NSURL"] }
objc2-core-graphics = { version = "0.3", features = ["CGImage", "CGColorSpace", "CGContext", "CGDataProvider", "CGDirectDisplay", "CGWindow"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
block2 = "0.6"
# Apple's Vision framework — VNRecognizeTextRequest. The crate ships with all
# sub-frameworks on by default, which drags in objc2-core-image / objc2-image-io
# / objc2-av-foundation / objc2-core-media / objc2-core-ml and dozens of Vision
# request types we never touch. We opt out of defaults and list only what the
# "Copy text" feature actually calls into: VNRecognizeTextRequest, VNObservation
# (VNRecognizedText + VNRecognizedTextObservation inherit from it), VNRequest
# (the performRequests:error: target type), VNRequestHandler
# (VNImageRequestHandler is gated behind this), and the enum VNRequestTextRecognitionLevel.
# Vision is part of the OS — no entitlement, no per-use cost, fully on-device.
objc2-vision = { version = "0.3", default-features = false, features = [
    "VNRecognizeTextRequest",
    "VNObservation",
    "VNRequest",
    "VNRequestHandler",
    "std",
    "alloc",
] }

[target."cfg(not(windows))".dependencies]
arboard = "3.6.1"
# Clipboard images on macOS/Linux use `arboard::set_image`. `xcap` was used
# historically here for screen capture; SCK migration removed the only
# consumer. If anything regresses, the
# former `xcap = "0.9.8"` line was gated under this same target.
